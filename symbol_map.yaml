# symbol_map.yaml — CLI symbol -> venue-native symbol 映射表
#
# 键 = 命令行 --symbol；值 = 各 venue 的实际命名
# venue 可选: entropy / lighter / lighter-rh / tradexyz
# 未列出的 venue、未命中的 symbol 均沿用命令行 --symbol
# （键区分大小写、精确匹配；文件不存在视为空表）
#
# 示例（去掉行首 # 即生效）:
#
ANTH:
  entropy: ANTH
  lighter-rh: ANTHROPIC
# BTC:
#   lighter-rh: BTC-USD
