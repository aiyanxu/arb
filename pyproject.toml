[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-arb"
description = "Two-venue perp arbitrage bot — Entropy vs Lighter mainnet / Lighter Robinhood / trade.xyz / Aster / Polymarket Perps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yourQuantGuy" }]
keywords = ["arbitrage", "hyperliquid", "lighter", "aster", "polymarket", "perpetual", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
live = [
    # transaction signing SDKs — needed only to trade; record-only works without them
    "hyperliquid-python-sdk>=0.9",
    "eth-account>=0.10",
    # Polymarket perps op signing: msgpack-encodes the compact op before keccak
    "msgpack>=1.0",
    # Lighter signing. Installs from the SDK's current main; for reproducible
    # deploys pin a commit: ...lighter-python.git@<commit-sha>
    "lighter-sdk @ git+https://github.com/elliottech/lighter-python.git",
    # shared nonce dispenser for processes trading one Lighter account
    # (LIGHTER_NONCE_REDIS_URL); optional — without it each process keeps a
    # local, server-seeded counter
    "redis>=5.0",
]

dev = [
    "pytest>=8",
    # fake Redis for the nonce-allocator tests; [lua] is required —
    # redis-py's Lock releases via an EVALSHA script
    "fakeredis[lua]>=2.23",
]

web = [
    # dashboard backend (`entropy-arb web`) — frontend build products are
    # committed under entropy_arb/webapp/static, so this is server-side only
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
]

[project.scripts]
entropy-arb = "entropy_arb.cli:main"

[tool.setuptools]
packages = ["entropy_arb", "entropy_arb.webapp"]

[tool.setuptools.dynamic]
version = { attr = "entropy_arb.__version__" }
